name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.3.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiosk-mdm-launcher-apk
        path: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.3.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.3
        name: "Kiosk MDM Launcher v1.0.3 (APK) - Vercel Cloud & Live Auto-Sync Edition"
        body: |
          ## 📱 Kiosk MDM Launcher & Device Policy Controller (v1.0.3)

          Production-ready native Android Kiosk Launcher & DPC Agent pre-configured to connect out-of-the-box with your **Vercel MDM Dashboard** (`https://server-gold-six-73.vercel.app`) and **Neon Serverless PostgreSQL**.

          ### 🚀 Features & Updates in v1.0.3:
          - **Vercel Cloud Integration:** Pre-configured with default endpoint `https://server-gold-six-73.vercel.app`—no manual typing needed.
          - **Continuous 15-Second Auto-Sync Loop:** Sends live hardware diagnostics and battery/Wi-Fi telemetry to the Vercel console and Neon PostgreSQL every 15 seconds.
          - **Real-Time Remote Control:** Instant command execution (Remote Lock, Siren Alarm, Volume, Whitelist changes) dispatched from the Vercel web console.
          - **Direct Neon PostgreSQL JDBC Client:** Tablet writes telemetry directly to Neon even if web servers are offline.
          - **Multi-App Kiosk Lockdown:** Restricts users strictly to approved whitelisted apps (`LOCK_TASK_FEATURE_HOME`).

          ### 📲 Installation Instructions:
          1. Download `kiosk-mdm-launcher-v1.0.3.apk` below.
          2. Connect your tablet via USB and ensure all accounts are removed (*Settings ➔ Accounts ➔ 0 accounts*).
          3. Install via ADB:
             ```bash
             adb install -r kiosk-mdm-launcher-v1.0.3.apk
             adb shell dpm set-device-owner com.kiosk.launcher/.receiver.KioskAdminReceiver
             ```
        files: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.3.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
