name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.2.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiosk-mdm-launcher-apk
        path: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.2.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.2
        name: "Kiosk MDM Launcher v1.0.2 (APK) - Instant Sync & Cleartext Enabled"
        body: |
          ## 📱 Kiosk MDM Launcher & Device Policy Controller (v1.0.2)

          Production-ready native Android Kiosk Launcher & DPC Agent designed for Android tablets, featuring **Immediate Neon Telemetry Sync**, **Cleartext Traffic Support**, and **LAN MDM Auto-Connection**.

          ### 🚀 Changes in v1.0.2:
          - **Cleartext Traffic Enabled (`android:usesCleartextTraffic="true"`):** Allows tablets on Android 9+ (API 28+) to communicate with local LAN MDM HTTP/WS servers without Android OS network blocks.
          - **Instant Background Sync:** Automatically syncs device hardware diagnostics to Neon Serverless PostgreSQL and the MDM Server immediately on launcher startup instead of waiting 15 minutes.
          - **Direct One-Tap Sync Buttons:** Admin Dashboard includes "Sync Tablet to Neon Now" and "Test & Ping Server" buttons with live real-time visual feedback.
          - **Default LAN Server Endpoint:** Configured to automatically target the host server (`http://192.168.0.11:3000`).

          ### 📲 Installation Instructions:
          1. Download `kiosk-mdm-launcher-v1.0.2.apk` below.
          2. Connect your tablet via USB and ensure all accounts are removed (*Settings ➔ Accounts ➔ 0 accounts*).
          3. Install via ADB:
             ```bash
             adb install -r kiosk-mdm-launcher-v1.0.2.apk
             adb shell dpm set-device-owner com.kiosk.launcher/.receiver.KioskAdminReceiver
             ```
        files: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.2.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
