name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.4.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiosk-mdm-launcher-apk
        path: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.4.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "Kiosk MDM Launcher v1.0.4 (APK) - App Drawer Icon & Android 14 Compatibility"
        body: |
          ## 📱 Kiosk MDM Launcher & Device Policy Controller (v1.0.4)

          Production-ready native Android Kiosk Launcher & DPC Agent with dual intent-filter architecture, Android 14+ crash-proofing, and Vercel Cloud MDM integration.

          ### 🚀 Fixes in v1.0.4:
          - **Separated Launcher and Home Intent Filters:** Resolves the issue where OEM launchers and package installers hide the app or disable the "Open" button. The app now displays normally with a clickable launcher icon in the tablet App Drawer and has the "Open" button enabled after install.
          - **Android 14 (API 34) Compatibility:** Added explicit `RECEIVER_EXPORTED` flags for battery state broadcasts to eliminate Android 14 `SecurityException` runtime crashes.
          - **Crash-Proof Class & Icon Loading:** Bounded icon rendering to prevent Out-Of-Memory exceptions and safely caught linkage errors in JDBC drivers.
          - **Pre-Configured Vercel Cloud Endpoint:** Auto-syncs to `https://server-gold-six-73.vercel.app` and Neon PostgreSQL every 15 seconds.

          ### 📲 Installation & Launch Instructions:
          1. Download `kiosk-mdm-launcher-v1.0.4.apk` below.
          2. Install via ADB or open from tablet file manager:
             ```bash
             adb install -r kiosk-mdm-launcher-v1.0.4.apk
             ```
          3. Launch the app directly from your tablet's app drawer or via ADB:
             ```bash
             adb shell am start -n com.kiosk.launcher/.ui.KioskLauncherActivity
             ```
          4. Provision Device Owner status:
             ```bash
             adb shell dpm set-device-owner com.kiosk.launcher/.receiver.KioskAdminReceiver
             ```
        files: app/build/outputs/apk/debug/kiosk-mdm-launcher-v1.0.4.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
